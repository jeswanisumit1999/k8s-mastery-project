<!DOCTYPE html>
<html>
<head>
  <title>K8s Demo App</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #items { list-style: none; padding: 0; }
    #items li { padding: 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>K8s Demo App — Items</h1>
  <ul id="items">Loading...</ul>
  <script>
    fetch('/api/items')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('items');
        list.innerHTML = '';
        data.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item.name + ' — ' + item.description;
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById('items').textContent = 'Error loading items: ' + err;
      });
  </script>
</body>
</html>
